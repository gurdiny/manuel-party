# Publica en GitHub Pages SOLO los archivos de la página (index.html, img/, audio/).
# optimizar.py, el README y los originales nunca llegan al sitio.
#
# Activar una sola vez: GitHub > Settings > Pages > Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar la carpeta pública
        run: |
          mkdir _site
          cp index.html _site/
          cp -r img audio _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
